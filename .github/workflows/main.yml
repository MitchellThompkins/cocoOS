name: build_and_test

on:
  push:
  schedule:
    - cron: '0 0 * * 0'

jobs:
    build_and_test:
        runs-on: ubuntu-latest
        container:
            image: ghcr.io/mitchellthompkins/embedded_sdk:latest
        steps:
            - name: checkout
              uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # actions/checkout@v6.0.3

            - name: build
              run: make build.all

            - name: test
              run: make test check-trace check-coverage
